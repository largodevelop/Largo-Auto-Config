<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      width: 64px;
      height: 64px;
      background: #121212;
      overflow: hidden;
    }
    .mark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      background: url("brand.png") center / contain no-repeat;
      filter: drop-shadow(0 0 var(--blur, 14px) rgba(167, 139, 250, var(--op, 0.42)));
    }
  </style>
</head>
<body>
  <div class="mark" id="m"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const blur = params.get("blur") || "14";
    const op = params.get("op") || "0.42";
    const m = document.getElementById("m");
    m.style.setProperty("--blur", blur + "px");
    m.style.setProperty("--op", op);
  </script>
</body>
</html>
